name: "🔒 Security Vulnerability Report"
description: "Report a potential security issue in CodeAtlas."
title: "[SECURITY]: "
labels: ["security", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **IMPORTANT**: For sensitive security vulnerabilities, please refer to our [Security Policy](file:///C:/Users/USER/Desktop/Extras/pending-projects/CodeAtlas/SECURITY.md) or submit via private disclosure channels whenever possible.
  - type: textarea
    id: vulnerability
    attributes:
      label: "Vulnerability Description"
      description: "Describe the security flaw, affected components, and potential impact."
    validations:
      required: true
  - type: textarea
    id: poc
    attributes:
      label: "Proof of Concept / Reproducible Payload"
      description: "Provide steps or code snippets demonstrating the vulnerability safely."
    validations:
      required: true
  - type: dropdown
    id: cvss_severity
    attributes:
      label: "Estimated Severity"
      options:
        - "Critical (CVSS 9.0 - 10.0)"
        - "High (CVSS 7.0 - 8.9)"
        - "Medium (CVSS 4.0 - 6.9)"
        - "Low (CVSS 0.1 - 3.9)"
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: "Suggested Remediation"
      description: "If you have a proposed fix, detail it here."
