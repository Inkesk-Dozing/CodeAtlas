name: "🐛 Bug Report"
description: "Report a bug, exception, or unexpected behavior in CodeAtlas."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! Please provide as much context as possible.
  - type: input
    id: version
    attributes:
      label: "CodeAtlas Version"
      description: "What version or commit hash of CodeAtlas are you running?"
      placeholder: "e.g., v0.1.0 or commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: "Affected Subsystem"
      description: "Which part of CodeAtlas is experiencing the bug?"
      options:
        - "Ingestion Engine (Tree-Sitter / Celery)"
        - "Architecture Graph Canvas (React Flow / Web)"
        - "Issue Mapping Pipeline"
        - "AI & RAG Chat Engine (Ollama / pgvector)"
        - "API Gateway (FastAPI / Auth)"
        - "Infrastructure & Docker Compose"
        - "Documentation / Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe what happened..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs & Stack Traces"
      description: "Paste relevant backend logs, browser console errors, or stack traces here."
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: "Environment Details"
      description: "OS, browser, Node version, Python version, Docker version, etc."
      placeholder: "OS: Windows 11 / Ubuntu 22.04 | Node: v20.11.0 | Python: 3.11.7 | Browser: Chrome 122"
