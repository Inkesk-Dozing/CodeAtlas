name: "✨ Feature Request"
description: "Propose a new feature, enhancement, or architectural improvement."
title: "[FEAT]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please explain the problem statement and technical design proposal.
  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "Is your feature request related to a problem? Please describe clearly."
      placeholder: "I'm frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the solution you'd like to see implemented."
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: "Architectural & Technical Impact"
      description: "Which services, database tables, or packages need to be updated?"
      placeholder: "e.g., Affects apps/api/parsers/python.py and CodeNode table schema in apps/api/models/entities.py"
  - type: dropdown
    id: priority
    attributes:
      label: "Suggested Priority"
      options:
        - "P0 - Critical (Blocking launch or core workflow)"
        - "P1 - High (Major product capability)"
        - "P2 - Medium (Enhancement / Convenience)"
        - "P3 - Low (Nice to have)"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Solutions Considered"
      description: "Describe any alternative solutions or features you've considered."
