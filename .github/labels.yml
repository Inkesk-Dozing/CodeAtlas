# --- Issue Types ---
- name: "type:feature"
  color: "a2eeef"
  description: "New user-facing functionality or core architectural capability"

- name: "type:bug"
  color: "d73a4a"
  description: "Something isn't working as specified or causing runtime exceptions"

- name: "type:security"
  color: "e11d48"
  description: "Vulnerability remediation, authentication hardening, or secret scanning"

- name: "type:performance"
  color: "ffc107"
  description: "Query optimization, memory leak resolution, or canvas frame rate improvements"

- name: "type:documentation"
  color: "0075ca"
  description: "Improvements or additions to technical documentation, OpenAPI specs, or PRD"

- name: "type:refactor"
  color: "7057ff"
  description: "Code restructuring, type safety enhancements, or dead code elimination"

- name: "type:test"
  color: "1d76db"
  description: "Unit, integration, golden set, or Playwright end-to-end tests"

- name: "type:infra"
  color: "fbca04"
  description: "Docker Compose, Kubernetes Helm, CI/CD GitHub Actions, or deployment pipelines"

