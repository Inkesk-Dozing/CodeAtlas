[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["__pycache__", ".ruff_cache", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "B008",    # FastAPI: Depends()/Query() in defaults is idiomatic
    "E501",    # line length enforced by formatter
    "RUF012",  # mutable class attrs annotated with ClassVar
    "SIM105",  # contextlib.suppress is not always clearer
]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "database",
    "middleware",
    "models",
    "parsers",
    "routers",
    "schemas",
    "services",
    "tasks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
